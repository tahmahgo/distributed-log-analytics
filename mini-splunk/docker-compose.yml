services:
  redis:
    image: redis:7-alpine
    container_name: splunk-redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: splunk-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always

  cassandra:
    image: cassandra:4.0
    container_name: splunk-cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=256M
      - HEAP_NEWSIZE=64M
      - CASSANDRA_CLUSTER_NAME=SplunkCluster
    restart: always
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES;"]
      interval: 10s
      timeout: 10s
      retries: 10

  api-gateway:
    build: ./api-gateway
    container_name: splunk-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - CASSANDRA_HOSTS=cassandra
    depends_on:
      cassandra:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    restart: always

  worker:
    build: ./worker
    container_name: splunk-worker
    environment:
      - RABBITMQ_HOST=rabbitmq
      - CASSANDRA_HOSTS=cassandra
    depends_on:
      cassandra:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always
